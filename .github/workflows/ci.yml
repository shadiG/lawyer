name: CI

# Sur les pull requests, et appelé par vps.yml avant chaque déploiement
# (DEPLOY-1). Pas de déclencheur « push » : vps.yml s'en charge sur main.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        # Le build pré-rend la page : Payload s'initialise sur une base jetable.
        env:
          PAYLOAD_SECRET: secret-de-ci-jetable-sans-valeur-0123456789
          DATABASE_URI: file:/tmp/ci.db
          MEDIA_DIR: /tmp/ci-media
